[tool.black]
line-length = 88
include = '\.py?$'
exclude = '(\.git|__pycache__|\.pytest_cache|\.venv)'

[tool.isort]
profile = "black"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[project]
name = "cc-sessions-man"
version = "0.1.0"
authors = [{ name = "j" }]
description = "List Claude Code sessions and whether each is done or waiting on you"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "send2trash>=2.1.0",
    "textual>=8.2.8",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "black>=26",
    "flake8>=7",
    "isort>=9",
    "pytest-cov>=7",
]

[project.urls]
Homepage = "https://github.com/jalansari/cc-sessions-man"
Issues = "https://github.com/jalansari/cc-sessions-man/issues"

[project.scripts]
cc-sessions = "cc_sessions_man.cli:main"
cc-sessions-ui = "cc_sessions_man.ui:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
