[project]
name = "cc-sessions-man"
version = "0.1.0"
description = "List Claude Code sessions and whether each is done or waiting on you"
readme = "README.md"
authors = [{ name = "j" }]
requires-python = ">=3.14"
dependencies = [
    "send2trash>=2.1.0",
    "textual>=8.2.8",
]

[project.scripts]
cc-sessions = "cc_sessions_man.cli:main"
cc-sessions-ui = "cc_sessions_man.ui:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
]
