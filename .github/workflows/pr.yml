name: PR
on:
  pull_request:
    types:
      - opened
      - synchronize

jobs:
  test:
    name: Quality & Test
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0

      - name: Python venv
        run: uv sync --locked

      - name: Format (black)
        run: uv run black --check --diff src tests benchmarks

      - name: Imports (isort)
        run: uv run isort --check-only --diff src tests benchmarks

      - name: Lint (flake8)
        run: uv run flake8 src tests benchmarks

      - name: Tests
        run: uv run pytest --cov=cc_sessions_man --cov-report=html

      - name: Store coverage
        uses: actions/upload-artifact@v7
        with:
          name: cov-reports
          path: |
            htmlcov
          retention-days: 7
